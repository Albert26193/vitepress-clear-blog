name: Deploy Docs

on:
  push:
    branches: [master]
    paths:
      - 'sites/demo/**'
      - 'sites/testbed/**'
      - 'packages/theme/**'
      - 'packages/vitepress-plugin-*/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          VITEPRESS_BASE: /vitepress-theme-link/demo/

      - run: pnpm -F=testbed build
        env:
          VITEPRESS_BASE: /vitepress-theme-link/testbed/

      - run: |
          mkdir -p _deploy/demo _deploy/testbed
          cp -r sites/demo/.vitepress/dist/* _deploy/demo/
          cp -r sites/testbed/.vitepress/dist/* _deploy/testbed/
          cp .github/workflows/index.html _deploy/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _deploy

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
