name: Publish npm beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Lockstep beta version, e.g. 0.1.0-beta.0'
        required: true
        type: string
      dry_run:
        description: 'Run npm publish in dry-run mode'
        required: true
        default: true
        type: boolean
      confirm:
        description: 'Required for real publish: publish-<version>-to-npm-beta'
        required: false
        type: string
      promote_latest:
        description: 'Also point the latest dist-tag at this beta version'
        required: false
        default: false
        type: boolean

concurrency:
  group: npm-publish-beta
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: git diff --exit-code

      - run: pnpm typecheck

      - run: pnpm test:unit

      - run: pnpm build

      - run: pnpm validate:packages

      - run: pnpm validate:consumer

      - run: pnpm release:check -- --version "${{ inputs.version }}" --require-build --require-master
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish:
    name: Publish beta
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Dry-run npm publish
        if: ${{ inputs.dry_run }}
        run: pnpm release:publish:beta -- --version "${{ inputs.version }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish npm beta
        if: ${{ !inputs.dry_run }}
        run: pnpm release:publish:beta -- --version "${{ inputs.version }}" --publish --confirm "${{ inputs.confirm }}"${{ inputs.promote_latest && ' --promote-latest' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
