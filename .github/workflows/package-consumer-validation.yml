name: Package Consumer Validation

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer-validation:
    name: Consumer Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # validate:consumer renders the scaffolded dev server in headless Chromium
      # to catch white screens, so the browser must be installed first.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm validate:consumer
