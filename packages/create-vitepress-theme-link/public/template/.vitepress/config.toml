# =============================================================================
# VitePress Theme Link — Configuration
# =============================================================================
# This file controls every aspect of your blog.  See the README or source
# defaults for further details.

# ---------------------------------------------------------------------------
# Site metadata (head tags, RSS, Open Graph)
# ---------------------------------------------------------------------------
[meta]
title = "My Blog"
description = "A personal blog powered by VitePress Theme Link"
author = "Blogger"
keywords = "blog, vitepress, static-site"
locale = "zh_CN"
lang = "zh-CN"
siteUrl = "https://your-blog.github.io"
theme-color = "#8a5cf5"

# Optional: ICP filing number displayed in the footer.
# icpNumber = ""

# Optional: link to the theme homepage shown in the footer.
# themeLink = "https://github.com/Albert26193/vitepress-theme-link"

# ---------------------------------------------------------------------------
# Homepage hero text
# ---------------------------------------------------------------------------
[homepage]
title = "My Blog"
description = "Welcome to my blog"

# ---------------------------------------------------------------------------
# Pagination — /pages route
# ---------------------------------------------------------------------------
# pageSizeCard — posts per page in card (grid) view.
# pageSizeList — posts per page in list view.
[page]
pageSizeCard = 10
pageSizeList = 5

# ---------------------------------------------------------------------------
# Date / time parsing
# ---------------------------------------------------------------------------
# frontmatterFields — which frontmatter keys are checked for post dates.
# formats          — input format hints (parsed by moment).
# outputFormat     — how dates appear in post listings.
# ---------------------------------------------------------------------------
[datetime]
frontmatterFields = ["date", "created", "createdAt", "published", "publishedAt"]
formats = ["YYYY-MM-DD", "YYYY/MM/DD", "YYYY-MM-DD HH:mm:ss", "YYYY/MM/DD HH:mm:ss", "YYYY-MM-DDTHH:mm:ssZ"]
outputFormat = "MMM D, YYYY"

# ---------------------------------------------------------------------------
# Blog listing defaults
# ---------------------------------------------------------------------------
[blog]
defaultViewMode = "card"    # "card" or "list"

# ---------------------------------------------------------------------------
# Outline (right-hand table of contents)
# ---------------------------------------------------------------------------
[outline]
title = "Table of Contents"

# ---------------------------------------------------------------------------
# Timeline page
# ---------------------------------------------------------------------------
[timeline]
sortDirection = "desc"      # "desc" or "asc"

# ---------------------------------------------------------------------------
# Wiki-link resolution
# ---------------------------------------------------------------------------
# Controls how [[wikilinks]] are resolved to real URLs.  The array order
# matters — earlier modes are tried first.
#
#   • repoRoot              — resolve relative to the repo root
#   • absolutePath          — treat the link as an absolute path
#   • relativeToCurrentFile — resolve relative to the source markdown file
#   • obsidianShortest      — Obsidian-style shortest-path matching
# ---------------------------------------------------------------------------
[links]
resolutionModes = ["repoRoot", "absolutePath", "relativeToCurrentFile", "obsidianShortest"]

# ---------------------------------------------------------------------------
# Navigation bar labels
# ---------------------------------------------------------------------------
[nav]
home = "Home"
tags = "Tags"
timeline = "Timeline"
pages = "Pages"
about = "About"

# ---------------------------------------------------------------------------
# Markdown features
# ---------------------------------------------------------------------------
# render_title — which strategy to use for displaying [[wikilink]] titles.
#   • frontmatter_title  — use the target page's frontmatter title
#   • first_heading      — use the first H1 in the target file
#   • alias              — use the link alias (the text after | in [[…|alias]])
#   • file_name          — derive from the file name
# link_style — visual style for internal links.
#   • origin — keep native markdown link style
#   • wiki   — render internal links with [[ ]] decoration
# image_dimension — control how image dimensions (width/height) are parsed.
#   • true                  — enable with default conventions
#   • false                 — disable entirely
#   • Object form (sub-fields are all optional):
#       [markdown.image_dimension]
#       enabled = true
#       alt_preset = true
#       github_title_suffix = true
#       pandoc_attr_list = true
#       obsidian_bare_size = true
#       obsidian_pixel_size = true
#       url_query_params = true
#       html_title_size = true
#       strip_dimension_query = false
#       [markdown.image_dimension.presets]
#       small  = 480
#       medium = 800
# ---------------------------------------------------------------------------
[markdown]
mathjax = true
wikilinks = true
footnote = true
hashtag = true
mermaid = true
mermaid_render = "svg"
callout = true
image_dimension = true
render_title = "frontmatter_title"
link_style = "origin"

# VitePress/Shiki code block highlight themes. Use a single string via
# `theme = "github-light"` inside [markdown] if you want one theme for all modes.
[markdown.theme]
light = "github-light"
dark = "ayu-dark"

# =============================================================================
# THEME — CSS variable overrides
# =============================================================================
# 18 configurable color keys. Each key maps to a VitePress CSS variable.
# Unused keys fall back to sensible defaults, so you only need to set the
# ones you care about.
#
# Background          vp-c-bg  vp-c-bg-alt  vp-c-bg-soft
# Brand               vp-c-brand  vp-c-brand-1  vp-c-brand-2
# Text                vp-c-text-1  vp-c-text-2  vp-c-text-3
# Borders             vp-c-divider
# Sidebar             vp-sidebar-bg-color
# Button              vp-button-brand-bg
# Code                vp-code-bg  vp-code-block-bg  c-text-code
# Inline semantics    c-text-strong  c-text-em
# Homepage            main-page-text
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Obsidian — purple accent (hsl 254,80%,68%), real Obsidian color scale
# ---------------------------------------------------------------------------
[theme]
vp-c-bg = "#ffffff"
vp-c-bg-alt = "#f6f6f6"
vp-c-bg-soft = "#f6f6f7"
vp-c-brand = "#9873f7"
vp-c-brand-1 = "#8a5cf5"
vp-c-brand-2 = "#a68af9"
vp-c-text-1 = "#222222"
vp-c-text-2 = "#5c5c5c"
vp-c-text-3 = "#929295"
vp-c-divider = "#e0e0e0"
vp-button-brand-bg = "#9873f7"
vp-code-bg = "#f6f6f6"
vp-code-block-bg = "#f6f6f6"
vp-sidebar-bg-color = "#f6f6f6"
c-text-code = "#e93147"
c-text-strong = "#111111"
c-text-em = "#086ddd"
main-page-text = "#050505"

[theme.dark]
vp-c-bg = "#1e1e1e"
vp-c-bg-alt = "#262626"
vp-c-bg-soft = "#202127"
vp-c-brand = "#8a5cf5"
vp-c-brand-1 = "#a68af9"
vp-c-brand-2 = "#c5b6fc"
vp-c-text-1 = "#dadada"
vp-c-text-2 = "#b3b3b3"
vp-c-text-3 = "#6a6a71"
vp-c-divider = "#363636"
vp-button-brand-bg = "#8a5cf5"
vp-code-bg = "#262626"
vp-code-block-bg = "#262626"
vp-sidebar-bg-color = "#242424"
c-text-code = "#fb464c"
c-text-strong = "#ebebeb"
c-text-em = "#027aff"
main-page-text = "#f0f0f0"

# =============================================================================
# PRESET COLOR SCHEMES
# =============================================================================
# Uncomment ONE block below and comment out the [theme] / [theme.dark]
# sections above to switch to a different look.
#
# Each preset fills all 18 keys.  The three semantic colors
# (c-text-code / c-text-strong / c-text-em) stay the same across presets
# because they are about readability, not branding.
# =============================================================================

