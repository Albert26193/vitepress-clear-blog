[meta]
title = "My Blog"
description = "A personal blog powered by VitePress Theme Link"
author = "Blogger"
keywords = "blog, vitepress, static-site"
locale = "zh_CN"
lang = "zh-CN"
siteUrl = "https://albert26193.github.io"
theme-color = "#0070F3"

[homepage]
title = "My Blog"
description = "A personal blog powered by VitePress Theme Link"

[page]
pageSize = 10

[datetime]
frontmatterFields = ["date", "date created", "date modified", "created", "createdAt", "published", "publishedAt"]
formats = ["YYYY-MM-DD", "YYYY/MM/DD", "YYYY-MM-DD HH:mm:ss", "YYYY/MM/DD HH:mm:ss", "YYYY-MM-DDTHH:mm:ssZ"]
outputFormat = "MMM D, YYYY"

[blog]
defaultViewMode = "card"

[outline]
title = "Table of Contents"

[timeline]
sortDirection = "desc"

[links]
resolutionModes = ["repoRoot", "absolutePath", "relativeToCurrentFile", "obsidianShortest"]

[nav]
home = "Home"
tags = "Tags"
timeline = "Timeline"
pages = "Pages"
about = "About"

# Social icons shown in the navbar.
[[social]]
icon = "github"
link = "https://github.com/Albert26193/vitepress-theme-link"

[markdown]
mathjax = true
wikilinks = true
footnote = true
hashtag = true
mermaid = true
mermaid_render = "svg"
callout = true
render_title = "frontmatter_title"
link_style = "wiki"

# VitePress/Shiki code block highlight themes.
[markdown.theme]
light = "github-light"
dark = "ayu-dark"

[theme]
vp-c-bg = "#ffffff"
vp-c-bg-alt = "#fafafa"
vp-c-bg-soft = "#f6f6f7"
vp-c-brand = "#0070F3"
vp-c-brand-1 = "#0070F3"
vp-c-brand-2 = "#3399FF"
vp-c-text-1 = "#171717"
vp-c-text-2 = "#737373"
vp-c-text-3 = "#929295"
vp-c-divider = "#e5e5e5"
vp-button-brand-bg = "#0070F3"
vp-code-bg = "#fafafa"
vp-code-block-bg = "#fafafa"
vp-sidebar-bg-color = "#fafafa"
c-text-code = "#e93147"
c-text-strong = "#111111"
c-text-em = "#086ddd"
main-page-text = "#050505"

# Sans-style site: the theme body/content follows the serif role, so a
# sans-looking site points both roles at the same sans family. The webfont
# is loaded (weights 400/700 automatic) from the official Google Fonts
# origin (overseas-friendly).
[theme.fonts]
sans = "Noto Sans SC"
serif = "Noto Sans SC"
webfont = "Noto Sans SC"
webfontBase = "https://fonts.googleapis.com"

[theme.dark]
vp-c-bg = "#0a0a0a"
vp-c-bg-alt = "#171717"
vp-c-bg-soft = "#202127"
vp-c-brand = "#0070F3"
vp-c-brand-1 = "#3399FF"
vp-c-brand-2 = "#66BBFF"
vp-c-text-1 = "#EDEDED"
vp-c-text-2 = "#888888"
vp-c-text-3 = "#6a6a71"
vp-c-divider = "#333333"
vp-button-brand-bg = "#0070F3"
vp-code-bg = "#171717"
vp-code-block-bg = "#171717"
vp-sidebar-bg-color = "#000000"
c-text-code = "#fb464c"
c-text-strong = "#ebebeb"
c-text-em = "#60a5fa"
main-page-text = "#f0f0f0"
